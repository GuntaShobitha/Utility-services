<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register — STACKLY</title>
<meta name="description" content="Create your STACKLY account.">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/enhance.css">
</head>
<body>
<div class="page-loader" id="pageLoader"><div class="loader-ring"></div></div>
<div class="auth">
  <aside class="auth-side">
    <div class="auth-illus"><img src="images/auth-illustration.webp" alt="" loading="lazy"></div>
    <span class="auth-shape a"></span><span class="auth-shape b"></span>
    <div class="brand"><a href="index.html"><img src="images/logo-dark.webp" alt="STACKLY Logo"></a></div>
    <div class="quote"><h2>"Join the network of greener operators."</h2><p>Free to start. Cancel anytime.</p></div>
  </aside>
  <main class="auth-main">
    <div class="top"><a href="index.html" class="nav-logo"><img src="images/logo-dark.webp" alt="STACKLY Logo"></a><a href="index.html"><span class="material-icons-outlined" style="font-size:1rem;vertical-align:middle">arrow_back</span> Back to home</a></div>
    <div class="auth-box reveal-zoom in">
      <h1>Create account.</h1>
      <p class="sub">Join STACKLY in under a minute.</p>
      <form id="registerForm" class="form-grid">
        <div class="field"><label>Role</label><select><option>User</option><option>Admin</option></select></div>
        <div class="field"><label>Full name</label><input type="text" placeholder="Jane Doe" required></div>
        <div class="field"><label>Email</label><input type="text" id="regEmail" placeholder="you@company.com" required><span class="auth-error">Email must contain @ and .com.</span></div>
        <div class="form-row">
          <div class="field"><label>Password</label><input type="password" id="regPass" placeholder="••••••••" required></div>
          <div class="field"><label>Confirm password</label><input type="password" id="regPass2" placeholder="••••••••" required><span class="auth-error">Passwords do not match.</span></div>
        </div>
        <button type="submit" class="btn btn-primary" style="justify-content:center">Create Account <span class="material-icons-outlined">person_add</span></button>
      </form>
      <p class="auth-alt">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>
</div>
<script src="assets/js/main.js"></script>
<script src="assets/js/enhance.js" defer></script>
</body>
</html>
