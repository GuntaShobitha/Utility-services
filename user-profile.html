<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile — STACKLY</title>
<meta name="description" content="Your STACKLY profile.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/enhance.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
</head>
<body data-role="user" data-active="profile">
<div class="page-loader" id="pageLoader"><div class="loader-ring"></div></div>
<div class="dash">
  <aside class="dash-side" id="dashSidebar"></aside>
  <main class="dash-main">
    <div class="dash-topbar" id="dashTopbar"></div>

    <div class="profile-hero" data-aos="fade-up">
      <div class="av lg js-user-initial">?</div>
      <div>
        <h2 class="js-user-name">User</h2>
        <div class="meta"><span><span class="material-icons-outlined" style="font-size:.9rem;vertical-align:middle">mail</span> <span class="js-user-email"></span></span><span><span class="material-icons-outlined" style="font-size:.9rem;vertical-align:middle">badge</span> <span class="js-user-role">Account User</span></span><span><span class="material-icons-outlined" style="font-size:.9rem;vertical-align:middle">place</span> San Francisco, CA</span></div>
      </div>
    </div>

    <div class="dash-row">
      <div class="panel">
        <h3>Personal information</h3>
        <form id="profileForm" class="form-grid">
          <div class="form-row">
            <div class="field"><label>Full name</label><input id="pfName" type="text" class="js-user-name-input" placeholder="Your name"></div>
            <div class="field"><label>Email</label><input type="email" class="js-user-email-input" placeholder="you@company.com"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>Phone</label><input type="tel" value="+1 (415) 555-0148"></div>
            <div class="field"><label>Company</label><input type="text" value="Vertex Co."></div>
          </div>
          <div class="field"><label>Bio</label><textarea>Sustainability lead passionate about circular economy and clean cities.</textarea></div>
          <button type="submit" class="btn btn-primary" style="justify-self:start">Save changes</button>
        </form>
      </div>
      <div class="panel">
        <h3>Account overview</h3>
        <div class="kpi-grid">
          <div class="kpi"><div class="lbl">Member since</div><div class="val">Mar 2024</div></div>
          <div class="kpi"><div class="lbl">Active projects</div><div class="val">6</div></div>
          <div class="kpi"><div class="lbl">Pickups YTD</div><div class="val">184</div></div>
          <div class="kpi"><div class="lbl">Plan</div><div class="val">Growth</div></div>
        </div>
        <h4 style="margin-top:20px">Recent logins</h4>
        <div class="activity" style="margin-top:8px">
          <div class="activity-item"><div class="ic"><span class="material-icons-outlined">devices</span></div><div><b>MacBook Pro · Safari</b><span>Today · San Francisco, CA</span></div></div>
          <div class="activity-item"><div class="ic"><span class="material-icons-outlined">phone_iphone</span></div><div><b>iPhone · Chrome</b><span>Yesterday · Oakland, CA</span></div></div>
        </div>
      </div>
    </div>

    <script>
    (function(){var n=document.querySelector('.js-user-name-input'), e=document.querySelector('.js-user-email-input');
      if(n) n.value=localStorage.getItem('stackly_name')||'';
      if(e) e.value=localStorage.getItem('stackly_email')||'';
    })();
    </script>

  </main>
</div>
<script src="assets/js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
