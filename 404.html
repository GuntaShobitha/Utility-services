<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page Not Found | STACKLY</title>
<meta name="description" content="The page you were looking for doesn't exist.">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

        <a href="index.html" class="btn btn-accent">Back to Home <span class="material-icons-outlined">home</span></a>
        <a href="#" onclick="history.back();return false;" class="btn btn-white">Go Back <span class="material-icons-outlined">arrow_back</span></a>
